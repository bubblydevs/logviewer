{% extends "base.html" %}
{% set has_hero = true %}
{% from '_hero.html' import hero %}
{% block title %}Not found{% endblock %}
{% block content %}

<main class="flex flex-1 flex-col">
    {% call hero('min-h-screen') %}
        <h1 class="text-4xl font-extrabold tracking-tight text-white sm:text-5xl">Page not found</h1>
        <p class="mx-auto mt-4 max-w-xl text-white/80">This transcript doesn't exist, or the link is wrong.</p>

        <a href="/" class="mt-8 inline-block rounded-full bg-white px-5 py-2.5 text-sm font-medium text-black transition hover:bg-white/90">Back to tickets</a>
    {% endcall %}
</main>

{% endblock %}
