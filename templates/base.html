<!DOCTYPE html>
<html lang="en" class="bg-page">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% if java_branding %}Java Transcripts{% else %}Logviewer{% endif %}{% endblock %}</title>
    <meta name="theme-color" content="#0f0f11">
    <link rel="shortcut icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/css/tailwind.css?v={{ css_version }}" rel="stylesheet">
    {# Keeps the page readable if the stylesheet is missing or still loading. #}
    <style>html, body { background-color: #0f0f11; color: #ffffff; }</style>
</head>
<body class="tw flex min-h-screen flex-col bg-page font-sans text-white {% if java_branding %}pb-16{% endif %}">
    {% include 'navbar.html' %}

    {% block content %}{% endblock %}

    {% include 'java_notice.html' %}

    {% block scripts %}{% endblock %}
</body>
</html>
