{# Photo banner in the style of help.shopjava.uk. Usage: {% call hero('min-h-[400px]') %}...{% endcall %} #}
{% macro hero(height="min-h-[420px]") -%}
<section class="relative flex {{ height }} items-center justify-center bg-cover bg-center"
         {% if brand.hero_url %}style="background-image: url('{{ brand.hero_url | e }}')"{% endif %}>
    <div class="absolute inset-0 {{ brand.hero_overlay }}"></div>
    <div class="absolute inset-x-0 bottom-0 h-24 bg-gradient-to-b from-transparent to-page"></div>
    <div class="relative mx-auto w-full max-w-3xl px-6 pb-8 pt-28 text-center">
        {{ caller() }}
    </div>
</section>
{%- endmacro %}
